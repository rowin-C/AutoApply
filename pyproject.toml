[project]
name = "autoapply"
version = "0.1.0"
description = "AI-assisted job application discovery pipeline"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.62",
    "pydantic>=2",
    "sqlmodel>=0.0.42",
    "typer>=0.27",
    "rich>=15",
    "pyyaml>=6",
]

[project.scripts]
aa = "autoapply.cli:app"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoapply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Scraping code is intentionally resilient: selector loops and one-bad-card
# handling must swallow broad exceptions and keep going rather than crash a
# whole run. Those patterns are part of the product, so BLE/S1xx stays on
# only where it genuinely matters (nothing to gate here).
[tool.ruff.lint]
ignore = [
    "BLE001",   # blind except Exception — deliberate in scraping fallbacks
    "S110",     # try/except: pass   — deliberate in resilience loops
    "S112",     # try/except: continue — deliberate in resilience loops
]